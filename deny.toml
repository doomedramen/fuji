# cargo-deny configuration for Fuji
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignored advisories - mostly unmaintained crates in transitive dependencies
ignore = [
    # rustls-pemfile: unmaintained, only in dev dependency (cargo-tarpaulin)
    "RUSTSEC-2025-0134",
    # backoff: unmaintained, TODO: migrate to backon crate
    "RUSTSEC-2025-0012",
    # derivative: unmaintained, transitive via keyring -> zbus
    "RUSTSEC-2024-0388",
    # idna: vulnerability in validator 0.16.x transitive dep, TODO: upgrade validator
    "RUSTSEC-2024-0421",
    # instant: unmaintained, transitive via backoff and keyring -> zbus
    "RUSTSEC-2024-0384",
    # proc-macro-error: unmaintained, transitive via validator_derive
    "RUSTSEC-2024-0370",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
