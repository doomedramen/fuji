[package]
name = "fuji"
version = "0.1.5"
edition = "2021"
rust-version = "1.80.0"
authors = ["Martin Page <m@rtin.page>"]
description = "A network file system mount manager with daemon-based architecture"
license = "ISC"
repository = "https://github.com/DoomedRamen/fuji"
homepage = "https://github.com/DoomedRamen/fuji"

[lib]
name = "fuji"
path = "src/lib.rs"

[[bin]]
name = "fuji"
path = "src/main.rs"


[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "mount_options_test"
path = "tests/unit/mount_options_test.rs"

[[test]]
name = "config_test"
path = "tests/unit/config_test.rs"

[[test]]
name = "monitoring_test"
path = "tests/unit/monitoring_test.rs"

[[test]]
name = "security_command_injection"
path = "tests/security_command_injection.rs"

[[test]]
name = "daemon_error_test"
path = "tests/unit/daemon_error_test.rs"

[[test]]
name = "security_path_traversal"
path = "tests/security_path_traversal.rs"

[[test]]
name = "security_encryption_improvements"
path = "tests/security_encryption_improvements.rs"

[[test]]
name = "connection_limits_test"
path = "tests/connection_limits_test.rs"

[[test]]
name = "security_credential_storage_test"
path = "tests/security_credential_storage_test.rs"

[[test]]
name = "security_audit_logging_test"
path = "tests/security_audit_logging_test.rs"

[[test]]
name = "platform_test"
path = "tests/unit/platform_test.rs"

[[test]]
name = "cli_test"
path = "tests/unit/cli_test.rs"

[[test]]
name = "security_process_isolation_test"
path = "tests/security_process_isolation_test.rs"

[[test]]
name = "security_intrusion_detection_test"
path = "tests/security_intrusion_detection_test.rs"

[[test]]
name = "security_integrity_test"
path = "tests/security_integrity_test.rs"

[[test]]
name = "security_config_security_test"
path = "tests/security_config_security_test.rs"

[[test]]
name = "security_secure_updates_test"
path = "tests/security_secure_updates_test.rs"

[[test]]
name = "security_dashboard_test"
path = "tests/security_dashboard_test.rs"

[[test]]
name = "mount_drivers_test"
path = "tests/unit/mount_drivers_test.rs"

[[test]]
name = "resource_limits_config_test"
path = "tests/unit/resource_limits_config_test.rs"

[[test]]
name = "service_test"
path = "tests/cli/service_test.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
url = "2.5"
base64 = "0.21"
shlex = "1.3"
whoami = "1.4"

# Configuration dependencies
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"

# Security dependencies
keyring = "2.0"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
jsonwebtoken = "9.0"
ring = "0.17.8"
hex = "0.4"
filetime = "0.2"

# Process isolation dependencies
nix = "0.27"
libc = "0.2"
uuid = { version = "1.6", features = ["v4", "serde"] }
hostname = "0.3"
csv = "1.3"


# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["mount", "process", "signal", "fs", "socket", "user", "mman", "sched"] }
libc = "0.2"

# Additional dependencies
async-trait = "0.1"
dirs = "5.0"
comfy-table = "7.0"
lazy_static = "1.4"

# Monitoring and persistence dependencies
tokio-cron-scheduler = "0.10"
backoff = { version = "0.4", features = ["tokio"] }
rusqlite = { version = "0.29", features = ["bundled", "chrono"] }
petgraph = "0.6"

# System monitoring dependencies
sysinfo = "0.30"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"
cargo-tarpaulin = "0.27"
mockall = "0.12"
criterion = "0.5"
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
