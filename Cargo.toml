[package]
name = "fuji"
version = "0.1.0"
edition = "2021"
authors = ["Martin Page <m@rtin.page>"]
description = "A network file system mount manager with daemon-based architecture"
license = "ISC"
repository = "https://github.com/DoomedRamen/fuji"

[lib]
name = "fuji"
path = "src/lib.rs"

[[bin]]
name = "fuji"
path = "src/main.rs"


[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "mount_options_test"
path = "tests/unit/mount_options_test.rs"

[[test]]
name = "config_test"
path = "tests/unit/config_test.rs"

[[test]]
name = "monitoring_test"
path = "tests/unit/monitoring_test.rs"

[[test]]
name = "security_command_injection"
path = "tests/security_command_injection.rs"

[[test]]
name = "daemon_error_test"
path = "tests/unit/daemon_error_test.rs"

[[test]]
name = "security_path_traversal"
path = "tests/security_path_traversal.rs"

[[test]]
name = "security_encryption_improvements"
path = "tests/security_encryption_improvements.rs"

[[test]]
name = "connection_limits_test"
path = "tests/connection_limits_test.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.21"
shlex = "1.3"

# Configuration dependencies
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"
notify = "6.1"

# Security dependencies
keyring = "2.0"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
jsonwebtoken = "9.0"
ring = "0.17.8"
hex = "0.4"


# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["mount", "process", "signal", "fs", "socket", "user"] }
libc = "0.2"

# Additional dependencies
async-trait = "0.1"
dirs = "5.0"
comfy-table = "7.0"
lazy_static = "1.4"

# Monitoring and persistence dependencies
tokio-cron-scheduler = "0.10"
backoff = { version = "0.4", features = ["tokio"] }
rusqlite = { version = "0.29", features = ["bundled", "chrono"] }
petgraph = "0.6"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"
cargo-tarpaulin = "0.27"
mockall = "0.12"
criterion = "0.5"
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"