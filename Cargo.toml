[package]
name = "fuji"
version = "0.1.0"
edition = "2021"
authors = ["Martin Page <m@rtin.page>"]
description = "A network file system mount manager with daemon-based architecture"
license = "ISC"
repository = "https://github.com/DoomedRamen/fuji"

[[bin]]
name = "fuji"
path = "src/main.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.21"

# Configuration dependencies
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"
notify = "6.1"

# Security dependencies
keyring = "2.0"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
jsonwebtoken = "9.0"
ring = "0.16"
hex = "0.4"


# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["mount", "process", "signal", "fs", "socket", "user"] }
libc = "0.2"

# Additional dependencies
async-trait = "0.1"
dirs = "5.0"
comfy-table = "7.0"

# Monitoring and persistence dependencies
tokio-cron-scheduler = "0.10"
backoff = { version = "0.4", features = ["tokio"] }
rusqlite = { version = "0.29", features = ["bundled", "chrono"] }
petgraph = "0.6"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"