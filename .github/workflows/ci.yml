name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Stage 1: Quick checks (fail fast)
  format:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: make fmt

  # Stage 2: Security-focused linting
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: make clippy

  # Stage 3: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install security tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Run security audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2025-0012 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0421 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0370
      - name: Run cargo-deny checks
        run: cargo deny check
      - uses: dtolnay/rust-toolchain@stable
      - name: Run security tests
        run: make test-security

  # Stage 4: Unit tests
  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: make test-unit

  # Stage 5: Coverage verification
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [format, clippy, security]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Generate coverage
        run: |
          cargo tarpaulin --lib --skip-clean --fail-under 70 \
            --workspace --exclude-files="scripts/*" \
            --timeout 600 \
            --output-dir target/coverage --out Xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: target/coverage/tarpaulin-report.xml

  # Stage 6: Integration tests with Docker
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Start Docker services
        run: docker compose up -d nfs-server smb-server
      - name: Wait for NFS server
        run: |
          echo "Waiting for NFS server..."
          i=1
          while [ $i -le 120 ]; do
            if docker compose exec -T nfs-server showmount -e localhost 2>/dev/null; then
              echo "NFS server is ready after $i seconds"
              exit 0
            fi
            sleep 1
            i=$((i+1))
          done
          echo "NFS server failed to start within 120 seconds"
          exit 1
      - name: Wait for SMB server
        run: |
          echo "Waiting for SMB server..."
          i=1
          while [ $i -le 120 ]; do
            if docker compose exec -T smb-server smbclient -L localhost -N 2>/dev/null; then
              echo "SMB server is ready after $i seconds"
              exit 0
            fi
            sleep 1
            i=$((i+1))
          done
          echo "SMB server failed to start within 120 seconds"
          exit 1
      - name: Run integration tests
        run: make test-integration
      - name: Cleanup
        if: always()
        run: docker compose down -v

  # Stage 7: Release build verification
  build:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: [test, integration, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - run: make build
