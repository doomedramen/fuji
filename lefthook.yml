# Lefthook configuration for Fuji
# Enterprise-grade security and quality checks

pre-commit:
  commands:
    # Bump patch version if changed
    version-bump:
      run: |
        if git diff --cached --name-only | grep -E "(Cargo\.toml|src/)"; then
          # Check if version has already been updated in this commit
          if (git diff --cached Cargo.toml | grep -q "version"); then
            echo "Version already updated in this commit"
          else
            echo "Auto-bumping patch version..."
            # Just update the Cargo.toml without committing
            cargo bump patch --manifest-path Cargo.toml
            # Stage the updated Cargo.toml
            git add Cargo.toml
          fi
        fi
      glob: "*"
      fail_text: "Version bump failed."

    # Auto-format and stage changes
    format:
      run: |
        make fmt
        git add -u '*.rs'
      glob: "*.rs"
      fail_text: "Code formatting failed."

    # Quick compilation check
    check:
      run: make build-dev
      glob: "*.rs"
      fail_text: "Code has compilation errors."

    # Critical security checks only
    security-quick:
      run: cargo test security_command_injection security_path_traversal --lib --no-fail-fast
      glob: "src/security/**/*.rs"
      fail_text: "Critical security checks failed."

pre-push:
  commands:
    # Full clippy check
    clippy:
      run: make clippy
      glob: "*.rs"
      fail_text: "Clippy found issues. Fix them before pushing."
      timeout: 120

    # All unit tests
    test-unit:
      run: make test-unit
      glob: "*.rs"
      fail_text: "Unit tests failed."
      timeout: 300

    # Security test suite
    test-security:
      run: make test-security
      glob: "src/security/**/*.rs"
      fail_text: "Security tests failed."
      timeout: 240

    # Build verification
    build-release:
      run: make build
      glob: "*.rs"
      fail_text: "Release build failed."
      timeout: 180

  # Execute commands in parallel where safe
  parallel: true

# Global settings
skip_output:
  - meta
  - success

# Skip patterns for faster execution
skip_glob:
  - "docs/**/*"
  - "scripts/**/*"
  - "*.md"
  - "*.yml"
  - "*.yaml"
  - "target/**/*"
  - ".github/**/*"
