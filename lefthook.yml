# Lefthook configuration for Fuji
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    # Check code formatting
    format:
      run: cargo fmt -- --check
      glob: "*.rs"

    # Run clippy lints (relaxed for local development)
    clippy:
      run: cargo clippy --all-targets --all-features -- -A dead_code -A unused-imports -A unused-variables -A warnings -A clippy::absurd_extreme_comparisons || true
      glob: "*.rs"

    # Run tests with coverage (disabled for local development)
    # test-coverage:
    #   run: ./scripts/generate-coverage.sh
    #   glob: "*.rs"

pre-push:
  commands:
    # Quick check for compilation errors
    check:
      run: cargo check --all-features
      glob: "*.rs"

    # Run clippy with relaxed settings for speed
    clippy:
      run: cargo clippy --all-targets --all-features -- -A dead_code -A unused_imports -A unused-variables -A warnings
      glob: "*.rs"

    # Run a quick subset of tests instead of full test suite
    test:
      run: cargo test --lib --bins  # Skip integration tests for speed
      glob: "*.rs"
      timeout: 300  # 5 minute timeout

# CI-specific configuration
ci:
  pre-commit:
    commands:
      # Full linting in CI
      clippy:
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Run all tests
      test:
        run: cargo test --all-features

      # Generate coverage report
      coverage:
        run: cargo tarpaulin --out Xml --output-dir target/coverage