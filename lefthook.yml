# Lefthook configuration for Fuji
# Enterprise-grade security and quality checks
# Note: Fuji is Linux-only. Runs in Dev Container on non-Linux platforms

pre-commit:
  commands:
    # Auto-format and stage changes
    format:
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          make fmt
          git add -u '*.rs'
        else
          # Running on macOS - ensure devcontainer is running, then execute
          ./scripts/ensure-devcontainer.sh
          devcontainer exec --workspace-folder . make fmt
          git add -u '*.rs'
        fi
      glob: "*.rs"
      fail_text: "Code formatting failed."

    # Quick compilation check
    check:
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          make build-dev
        else
          # Running on macOS - ensure devcontainer is running, then execute
          ./scripts/ensure-devcontainer.sh
          devcontainer exec --workspace-folder . make build-dev
        fi
      glob: "*.rs"
      fail_text: "Code has compilation errors."

pre-push:
  commands:
    # Full clippy check (runs first to build artifacts)
    clippy:
      priority: 1
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          CARGO_BUILD_JOBS=2 make clippy
        else
          # Running on macOS - ensure devcontainer is running, then execute with limited parallelism
          ./scripts/ensure-devcontainer.sh
          devcontainer exec --workspace-folder . env CARGO_BUILD_JOBS=2 make clippy
        fi
      glob: "*.rs"
      fail_text: "Clippy found issues. Fix them before pushing."
      timeout: 120

    # Library unit tests (reuses clippy artifacts when run sequentially)
    test-unit:
      priority: 2
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          CARGO_BUILD_JOBS=2 cargo test --lib --all-features --no-fail-fast
        else
          # Running on macOS - ensure devcontainer is running, then execute with limited parallelism to avoid OOM
          ./scripts/ensure-devcontainer.sh
          devcontainer exec --workspace-folder . env CARGO_BUILD_JOBS=2 cargo test --lib --all-features --no-fail-fast
        fi
      glob: "*.rs"
      fail_text: "Unit tests failed."
      timeout: 300

    # Note: Release build moved to CI to save time locally
    # Run manually with: make build

  # Execute commands sequentially to:
  # 1. Avoid OOM in dev container
  # 2. Allow test-unit to reuse clippy's build artifacts
  parallel: false

# Global settings
skip_output:
  - meta
  - success

# Skip patterns for faster execution
skip_glob:
  - "docs/**/*"
  - "scripts/**/*"
  - "*.md"
  - "*.yml"
  - "*.yaml"
  - "target/**/*"
  - ".github/**/*"
