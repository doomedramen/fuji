# Lefthook configuration for Fuji
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    # Check code formatting
    format:
      run: cargo fmt -- --check
      glob: "*.rs"

    # Run clippy lints (relaxed for local development)
    clippy:
      run: cargo clippy --all-targets --all-features -- -A dead_code -A unused-imports -A unused-variables -A warnings -A clippy::absurd_extreme_comparisons || true
      glob: "*.rs"

    # Run tests with coverage (disabled for local development)
    # test-coverage:
    #   run: ./scripts/generate-coverage.sh
    #   glob: "*.rs"

pre-push:
  commands:
    # Full compilation check (equivalent to CI Build job)
    check:
      run: cargo check --all-targets --all-features
      glob: "*.rs"

    # Run clippy with warnings allowed (CI will enforce strict checks)
    clippy:
      run: cargo clippy --all-targets --all-features --quiet
      glob: "*.rs"

    # Run all tests (same as CI)
    test:
      run: cargo test --all-features
      glob: "*.rs"
      timeout: 600  # 10 minute timeout

    # Build in release mode to catch release build issues
    build-release:
      run: cargo build --release
      glob: "*.rs"
      timeout: 300

# CI-specific configuration
ci:
  pre-commit:
    commands:
      # Full linting in CI
      clippy:
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Run all tests
      test:
        run: cargo test --all-features

      # Generate coverage report
      coverage:
        run: cargo tarpaulin --out Xml --output-dir target/coverage