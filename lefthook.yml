# Lefthook configuration for Fuji
# Enterprise-grade security and quality checks
# Note: Fuji is Linux-only. On non-Linux, hooks run via Dev Container CLI

pre-commit:
  commands:
    # Auto-format and stage changes
    format:
      run: |
        # Check if we're on Linux
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux, execute directly
          make fmt
          git add -u '*.rs'
        else
          # Not on Linux, use Dev Container
          if command -v devcontainer &> /dev/null; then
            # Check if container is already running
            if ! devcontainer ls-running 2>/dev/null | grep -q "fuji"; then
              echo "Starting Dev Container for formatting..."
              devcontainer up --workspace-folder . > /dev/null 2>&1
            fi
            # Run format in container
            devcontainer exec --workspace-folder . bash -c "cd /app && make fmt && git add -u '*.rs'"
          else
            echo "⚠️  Skipping format: Dev Container CLI not installed"
            echo "   Install with: npm install -g @devcontainers/cli"
            echo "   Or use VS Code with Dev Containers extension"
          fi
        fi
      glob: "*.rs"
      fail_text: "Code formatting failed."

    # Quick compilation check
    check:
      run: |
        # Check if we're on Linux
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux, execute directly
          make build-dev
        else
          # Not on Linux, use Dev Container
          if command -v devcontainer &> /dev/null; then
            # Check if container is already running
            if ! devcontainer ls-running 2>/dev/null | grep -q "fuji"; then
              echo "Starting Dev Container for build check..."
              devcontainer up --workspace-folder . > /dev/null 2>&1
            fi
            # Run build in container
            devcontainer exec --workspace-folder . bash -c "cd /app && make build-dev"
          else
            echo "⚠️  Skipping build check: Dev Container CLI not installed"
            echo "   Install with: npm install -g @devcontainers/cli"
            echo "   Or use VS Code with Dev Containers extension"
          fi
        fi
      glob: "*.rs"
      fail_text: "Code has compilation errors."

pre-push:
  commands:
    # Full clippy check
    clippy:
      run: |
        # Check if we're on Linux
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux, execute directly
          make clippy
        else
          # Not on Linux, use Dev Container
          if command -v devcontainer &> /dev/null; then
            # Check if container is already running
            if ! devcontainer ls-running 2>/dev/null | grep -q "fuji"; then
              echo "Starting Dev Container for clippy..."
              devcontainer up --workspace-folder . > /dev/null 2>&1
            fi
            # Run clippy in container
            devcontainer exec --workspace-folder . bash -c "cd /app && make clippy"
          else
            echo "❌ ERROR: Dev Container CLI not found!"
            echo ""
            echo "Fuji is Linux-only. To push changes:"
            echo ""
            echo "Option 1: VS Code (Recommended)"
            echo "  1. Install 'Dev Containers' extension"
            echo "  2. Cmd+Shift+P → 'Dev Containers: Reopen in Container'"
            echo "  3. Push from within the container"
            echo ""
            echo "Option 2: CLI"
            echo "  1. npm install -g @devcontainers/cli"
            echo "  2. Push from within the container"
            echo ""
            exit 1
          fi
        fi
      glob: "*.rs"
      fail_text: "Clippy found issues. Fix them before pushing."
      timeout: 120

    # All unit tests
    test-unit:
      run: |
        # Check if we're on Linux
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux, execute directly
          cargo test --all-features --no-fail-fast -- --test-threads=1 2>&1
        else
          # Not on Linux, use Dev Container
          if command -v devcontainer &> /dev/null; then
            # Check if container is already running
            if ! devcontainer ls-running 2>/dev/null | grep -q "fuji"; then
              echo "Starting Dev Container for tests..."
              devcontainer up --workspace-folder . > /dev/null 2>&1
            fi
            # Run tests in container
            devcontainer exec --workspace-folder . bash -c "cd /app && cargo test --all-features --no-fail-fast -- --test-threads=1"
          else
            echo "❌ ERROR: Dev Container CLI not found!"
            echo ""
            echo "Fuji is Linux-only. To push changes:"
            echo ""
            echo "Option 1: VS Code (Recommended)"
            echo "  1. Install 'Dev Containers' extension"
            echo "  2. Cmd+Shift+P → 'Dev Containers: Reopen in Container'"
            echo "  3. Push from within the container"
            echo ""
            echo "Option 2: CLI"
            echo "  1. npm install -g @devcontainers/cli"
            echo "  2. Push from within the container"
            echo ""
            exit 1
          fi
        fi
      glob: "*.rs"
      fail_text: "Unit tests failed."
      timeout: 300

    # Build verification
    build-release:
      run: |
        # Check if we're on Linux
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux, execute directly
          make build
        else
          # Not on Linux, use Dev Container
          if command -v devcontainer &> /dev/null; then
            # Check if container is already running
            if ! devcontainer ls-running 2>/dev/null | grep -q "fuji"; then
              echo "Starting Dev Container for release build..."
              devcontainer up --workspace-folder . > /dev/null 2>&1
            fi
            # Run build in container
            devcontainer exec --workspace-folder . bash -c "cd /app && make build"
          else
            echo "❌ ERROR: Dev Container CLI not found!"
            echo ""
            echo "Fuji is Linux-only. To push changes:"
            echo ""
            echo "Option 1: VS Code (Recommended)"
            echo "  1. Install 'Dev Containers' extension"
            echo "  2. Cmd+Shift+P → 'Dev Containers: Reopen in Container'"
            echo "  3. Push from within the container"
            echo ""
            echo "Option 2: CLI"
            echo "  1. npm install -g @devcontainers/cli"
            echo "  2. Push from within the container"
            echo ""
            exit 1
          fi
        fi
      glob: "*.rs"
      fail_text: "Release build failed."
      timeout: 180

  # Execute commands in parallel where safe
  parallel: true

# Global settings
skip_output:
  - meta
  - success

# Skip patterns for faster execution
skip_glob:
  - "docs/**/*"
  - "scripts/**/*"
  - "*.md"
  - "*.yml"
  - "*.yaml"
  - "target/**/*"
  - ".github/**/*"
