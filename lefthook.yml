# Lefthook configuration for Fuji
# Enterprise-grade security and quality checks
# Note: Fuji is Linux-only. Runs in Dev Container on non-Linux platforms

pre-commit:
  commands:
    # Auto-format and stage changes
    format:
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          make fmt
          git add -u '*.rs'
        else
          # Running on macOS - execute in dev container
          devcontainer exec --workspace-folder . make fmt
          git add -u '*.rs'
        fi
      glob: "*.rs"
      fail_text: "Code formatting failed."

    # Quick compilation check
    check:
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          make build-dev
        else
          # Running on macOS - execute in dev container
          devcontainer exec --workspace-folder . make build-dev
        fi
      glob: "*.rs"
      fail_text: "Code has compilation errors."

pre-push:
  commands:
    # Full clippy check
    clippy:
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          make clippy
        else
          # Running on macOS - execute in dev container
          devcontainer exec --workspace-folder . make clippy
        fi
      glob: "*.rs"
      fail_text: "Clippy found issues. Fix them before pushing."
      timeout: 120

    # All unit tests
    test-unit:
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          cargo test --all-features --no-fail-fast -- --test-threads=1 2>&1
        else
          # Running on macOS - execute in dev container
          devcontainer exec --workspace-folder . cargo test --all-features --no-fail-fast -- --test-threads=1 2>&1
        fi
      glob: "*.rs"
      fail_text: "Unit tests failed."
      timeout: 300

    # Build verification
    build-release:
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          # Running on Linux - execute directly
          make build
        else
          # Running on macOS - execute in dev container
          devcontainer exec --workspace-folder . make build
        fi
      glob: "*.rs"
      fail_text: "Release build failed."
      timeout: 180

  # Execute commands in parallel where safe
  parallel: true

# Global settings
skip_output:
  - meta
  - success

# Skip patterns for faster execution
skip_glob:
  - "docs/**/*"
  - "scripts/**/*"
  - "*.md"
  - "*.yml"
  - "*.yaml"
  - "target/**/*"
  - ".github/**/*"
