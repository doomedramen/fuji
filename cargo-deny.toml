# Cargo-deny configuration for Fuji
# Enterprise dependency security policy

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
unsound = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
copyleft = "warn"
allow-osi-fsf-free = "neither"
default = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl-sys", use-instead = "rustls" },
    { name = "native-tls", use-instead = "rustls" },
    { name = "libssh2-sys", use-instead = "ssh2-rs" },
]
skip = [
]
skip-tree = [
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[licenses.private]
ignore = false