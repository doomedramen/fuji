services:
  nfs-server:
    image: erichough/nfs-server:latest
    container_name: fuji-nfs-server
    privileged: true
    ports:
      - "2049:2049"
      - "2049:2049/udp"
    environment:
      - NFS_EXPORT_1=/exports
      - NFS_EXPORT_1_ACCESS=172.20.0.0/16(rw,sync,no_subtree_check,no_root_squash)
    volumes:
      - nfs_exports:/exports
    networks:
      - fuji-network

  smb-server:
    image: dperson/samba:latest
    container_name: fuji-smb-server
    ports:
      - "139:139"
      - "445:445"
    environment:
      - TZ=UTC
      - GUEST=yes
      - SHARE=public;/srv/samba/public;yes;no;no;all;none
      - SHARE=data;/srv/samba/data;yes;no;no;all;none
      - SHARE=media;/srv/samba/media;yes;no;no;all;none
    volumes:
      - smb_share:/srv/samba/public
      - smb_data:/srv/samba/data
      - smb_media:/srv/samba/media
    networks:
      - fuji-network

  debian-test:
    build:
      context: .
      dockerfile: Dockerfile.debian
    container_name: fuji-debian-test
    privileged: true
    depends_on:
      - nfs-server
      - smb-server
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./target:/target:ro
    networks:
      - fuji-network
    command:
      - sh
      - -c
      - |
        echo "Waiting for NFS and SMB servers to be ready..."
        sleep 15
        echo "Testing NFS server..."
        showmount -e nfs-server
        echo "Testing SMB server..."
        smbclient -L //smb-server -U guest%
        echo "Building and testing Fuji..."
        cd /app
        cargo build --release
        echo "Starting daemon in background..."
        /usr/local/bin/fuji daemon start &
        DAEMON_PID=$$!
        echo "Daemon started with PID: $$DAEMON_PID"
        echo "Waiting for daemon to be ready..."
        sleep 3
        echo "Checking if daemon is alive..."
        if [ ! -z "$$DAEMON_PID" ] && kill -0 $$DAEMON_PID 2>/dev/null; then
          echo "Daemon process is alive"
        else
          echo "Daemon process not found"
        fi
        echo "Checking socket..."
        ls -la /run/fuji.sock 2>/dev/null || echo "Socket not found"
        echo "Checking daemon status..."
        /usr/local/bin/fuji status || echo "Status check failed, but continuing..."
        echo "Testing NFS mount..."
        /usr/local/bin/fuji mount nfs://nfs-server/exports
        sleep 2
        echo "Testing SMB mount..."
        /usr/local/bin/fuji mount smb://smb-server/public
        sleep 2
        echo "Checking status..."
        /usr/local/bin/fuji status || echo "Final status check failed, but tests completed!"
        echo "All tests completed successfully!"

volumes:
  nfs_exports:
  smb_share:
  smb_data:
  smb_media:

networks:
  fuji-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16