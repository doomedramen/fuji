version: '3.8'

services:
  nfs-server:
    image: erichough/nfs-server:latest
    container_name: fuji-nfs-server
    hostname: nfs-server
    privileged: true
    volumes:
      - nfs-exports:/exports
    networks:
      - fuji-test
    environment:
      - NFS_EXPORT_0=/exports                   *(rw,sync,no_subtree_check,no_root_squash,insecure)
      - NFS_EXPORT_1=/exports/data              *(rw,sync,no_subtree_check,no_root_squash,insecure)
      - NFS_EXPORT_2=/exports/media             *(ro,sync,no_subtree_check,no_root_squash,insecure)
    command: >
      sh -c "
        mkdir -p /exports/data /exports/media /exports/iso &&
        echo 'This is the data export' > /exports/data/test.txt &&
        echo 'This is the media export' > /exports/media/test.txt &&
        echo 'This is the iso export' > /exports/iso/test.txt &&
        /usr/local/bin/entrypoint.sh
      "
    healthcheck:
      test: ["CMD", "showmount", "-e", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "2049:2049"
      - "10111:111"  # rpcbind - mapped to 10111 to avoid conflict with macOS
      - "32765-32767:32765-32767"

  smb-server:
    image: dperson/samba
    container_name: fuji-smb-server
    hostname: smb-server
    privileged: true
    volumes:
      - smb-shares:/shares
    networks:
      - fuji-test
    command: >
      -s "data;/shares/data;yes;no;yes;all;testuser;testpass"
      -s "media;/shares/media;yes;no;yes;all;testuser;testpass"
      -s "public;/shares/public;yes;no;yes;all;guest;none"
      -p
      -u "testuser;testpass"
    healthcheck:
      test: ["CMD", "smbclient", "-L", "localhost", "-N"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "139:139"
      - "445:445"

  debian-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.debian
    container_name: fuji-test-client
    privileged: true
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    networks:
      - fuji-test
    environment:
      - RUST_LOG=debug
    depends_on:
      nfs-server:
        condition: service_healthy
      smb-server:
        condition: service_healthy
    command: tail -f /dev/null  # Keep container running for interactive testing
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE

  systemd-test:
    image: jrei/systemd-ubuntu:20.04
    container_name: fuji-systemd-test
    hostname: systemd-test
    privileged: true
    volumes:
      - .:/app:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - systemd-test-etc:/etc
    networks:
      - fuji-test
    environment:
      - RUST_LOG=debug
    depends_on:
      nfs-server:
        condition: service_healthy
      smb-server:
        condition: service_healthy
    # systemd is the init system
    command: /lib/systemd/systemd
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
    tmpfs:
      - /run
      - /run/lock
      - /tmp

volumes:
  nfs-exports:
  smb-shares:
  cargo-cache:
  target-cache:
  systemd-test-etc:

networks:
  fuji-test:
    driver: bridge